name: AutoCorrect Fix

on:
  push:
    branches: [main]

jobs:
  autocorrect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install AutoCorrect
        run: |
          curl -sSL -o autocorrect.tar.gz \
            https://github.com/huacnlee/autocorrect/releases/download/v2.14.0/autocorrect-linux-amd64.tar.gz
          tar -xzf autocorrect.tar.gz
          sudo mv autocorrect /usr/local/bin/

      - name: AutoCorrect Fix
        run: autocorrect --fix .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "style: autocorrect fix"
          title: "style: AutoCorrect 自动修复"
          branch: autocorrect/fix
          delete-branch: true
