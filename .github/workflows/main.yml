name: AutoCorrect Fix

on:
  push:
    branches: [main]

jobs:
  autocorrect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install AutoCorrect
        run: |
          curl -fsSL -o /tmp/autocorrect.tar.gz \
            https://github.com/huacnlee/autocorrect/releases/download/v2.14.0/autocorrect-linux-amd64.tar.gz
          tar -xzf /tmp/autocorrect.tar.gz -C /tmp
          sudo mv /tmp/autocorrect /usr/local/bin/

      - name: AutoCorrect Fix
        run: autocorrect --fix .

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "style: autocorrect fix"
          title: "style: AutoCorrect fix"
          branch: autocorrect/fix
          delete-branch: true
