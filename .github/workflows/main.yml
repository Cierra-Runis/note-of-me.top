on:
  push: 
    branches:
      - main

jobs:
  auto_correct:
    name: AutoCorrect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: AutoCorrect
        uses: huacnlee/autocorrect-action@v2
      - name: Report ReviewDog
        if: failure()
        uses: huacnlee/autocorrect-action@v2
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          reviewdog: true
